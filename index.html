<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>คิวสอบสัมภาษณ์ DSSI</title>
  <link rel="stylesheet" href="css/output.css">
  <script src="js/config.js" defer></script>
  <script src="js/strings.th.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/student.js" defer></script>
  <script src="vendor/alpine.min.js" defer></script>
</head>
<body>
<div class="page" x-data="studentPage" x-cloak>
  <header class="topbar">
    <div class="brand-logos">
      <img class="logo-sci" width="44" height="44" src="assets/sci-ubu-logo.png" alt="คณะวิทยาศาสตร์ มหาวิทยาลัยอุบลราชธานี">
      <img class="logo-dssi" width="88" height="44" src="assets/dssi-logo.png" alt="DSSI">
    </div>
    <p class="brand-title" x-text="S.siteName"></p>
    <a class="btn btn-nav" href="teacher.html" x-text="T.navTeacher"></a>
  </header>

  <div class="alert-info" role="status" x-show="offline" x-text="S.err.network"></div>
  <div class="alert-info" role="status" x-show="pollProblem && !offline" x-text="T.pollProblem"></div>

  <!-- 0. เข้าคิว: ชื่อ + เบอร์โทรศัพท์ -->
  <main class="main-grid" x-show="showForm">
    <section class="col-left">
      <h1 class="heading-xl"><span x-text="T.joinTop"></span><br><span class="grad-text" x-text="T.joinGrad"></span></h1>
      <p class="lead" x-text="T.joinLead"></p>
    </section>
    <form class="col-right card" @submit.prevent="join()" novalidate>
      <div>
        <label class="label" for="s-name" x-text="T.nameLabel"></label>
        <input id="s-name" class="field" type="text" autocomplete="name" aria-describedby="s-name-hint" x-model="nameInput">
        <p id="s-name-hint" class="small mt-1" x-text="T.nameHint"></p>
      </div>
      <div>
        <label class="label" for="s-phone" x-text="T.phoneLabel"></label>
        <input id="s-phone" class="field" type="tel" inputmode="tel" autocomplete="tel" aria-describedby="s-phone-hint" x-model="phoneInput">
        <p id="s-phone-hint" class="small mt-1" x-text="T.phoneHint"></p>
      </div>
      <p class="alert" role="alert" x-show="error" x-text="error"></p>
      <button type="submit" class="btn btn-primary" :disabled="busy" x-text="T.joinSubmit"></button>
    </form>
  </main>

  <!-- 0.1 เลือกรอบ (ชื่ออยู่หลายรอบ) -->
  <main class="main-grid" x-show="showPick">
    <section class="col-left">
      <h1 class="heading-xl"><span x-text="T.pickTop"></span><br><span class="grad-text" x-text="T.pickGrad"></span></h1>
      <p class="lead" x-text="T.pickLead"></p>
    </section>
    <section class="col-right card">
      <template x-for="r in rounds" :key="r.code">
        <button type="button" class="btn btn-secondary" :disabled="busy" @click="pickRound(r.code)" x-text="r.name"></button>
      </template>
      <p class="alert" role="alert" x-show="error" x-text="error"></p>
      <button type="button" class="btn btn-secondary" :disabled="busy" @click="backToForm()" x-text="T.pickBack"></button>
    </section>
  </main>

  <!-- กำลังตรวจสอบตั๋วที่จำไว้ -->
  <main class="main-grid" x-show="showLoading">
    <section class="col-left">
      <p class="lead" role="status" x-text="T.loading"></p>
    </section>
  </main>

  <!-- 1. รอคิว -->
  <main class="main-grid" x-show="isWait">
    <template x-if="isWait">
      <section class="col-left">
        <span class="badge"><span class="dot dot-go"></span><span x-text="T.badgeWait(info.roundName, info.freeTeachers)"></span></span>
        <h1 class="heading-xl"><span x-text="T.youAre"></span><br><span class="grad-text" x-text="T.queueNo(info.position)"></span></h1>
        <p class="lead" x-text="T.waitLead"></p>
        <div class="flex flex-wrap items-center gap-2" role="img" :aria-label="T.aheadLabel(info.ahead) + ' ' + T.behindLabel(info.behind || 0)">
          <template x-for="i in range(aheadDots)" :key="'a' + i"><span class="q-dot"></span></template>
          <span class="q-you" x-text="T.you"></span>
          <template x-for="i in range(behindDots)" :key="'b' + i"><span class="q-back"></span></template>
        </div>
      </section>
    </template>
    <template x-if="isWait">
      <section class="col-right card">
        <div>
          <div class="small" x-text="info.roundName"></div>
          <div class="font-heading text-2xl font-bold break-words" x-text="info.name"></div>
        </div>
        <button type="button" class="btn btn-secondary" x-show="!confirmChange" @click="askChange()" x-text="T.changeName"></button>
        <div class="flex flex-col gap-3" x-show="confirmChange">
          <p class="alert" role="alert" x-text="T.changeWarn"></p>
          <button type="button" class="btn btn-primary" @click="changeName()" x-text="T.changeConfirm"></button>
          <button type="button" class="btn btn-secondary" @click="confirmChange = false" x-text="T.cancel"></button>
        </div>
      </section>
    </template>
  </main>

  <!-- 2. ถึงคิว -->
  <main class="main-grid" x-show="isBusy">
    <template x-if="isBusy">
      <section class="col-left">
        <span class="badge"><span class="dot dot-go"></span><span x-text="T.badgeBusy"></span></span>
        <h1 class="heading-xl"><span x-text="T.busyTop"></span><br><span class="grad-text" x-text="T.busyGrad"></span></h1>
        <p class="lead" x-text="T.busyLead"></p>
      </section>
    </template>
    <template x-if="isBusy">
      <section class="col-right card">
        <div class="card-soft">
          <div class="small" x-text="T.teacherLabel"></div>
          <div class="font-heading text-2xl font-bold break-words" x-text="info.teacher"></div>
          <div class="small mt-2" x-text="T.meetRoom"></div>
        </div>
        <p class="alert" role="alert" x-show="!meetOk" x-text="T.meetInvalid"></p>
        <div class="stack-bottom">
          <a class="btn btn-primary" :href="meetHref" :aria-disabled="!meetOk" target="_blank" rel="noopener noreferrer">
            <span x-text="T.joinMeet"></span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
        </div>
      </section>
    </template>
  </main>

  <!-- เสร็จแล้ว -->
  <main class="main-grid" x-show="isDone">
    <section class="col-left">
      <span class="badge"><span class="dot"></span><span x-text="T.badgeDone"></span></span>
      <h1 class="heading-xl"><span x-text="T.doneTop"></span><br><span class="grad-text" x-text="T.doneGrad"></span></h1>
      <p class="lead" x-text="T.doneLead"></p>
      <button type="button" class="btn btn-secondary" @click="changeName()" x-text="T.newEntry"></button>
    </section>
  </main>

  <!-- ถูกข้ามคิว -->
  <main class="main-grid" x-show="isSkipped">
    <section class="col-left">
      <span class="badge"><span class="dot dot-danger"></span><span x-text="T.badgeSkipped"></span></span>
      <h1 class="heading-xl"><span x-text="T.skippedTop"></span><br><span class="grad-text" x-text="T.skippedGrad"></span></h1>
      <p class="lead" x-text="T.skippedLead"></p>
      <button type="button" class="btn btn-secondary" @click="changeName()" x-text="T.newEntry"></button>
    </section>
  </main>

  <footer class="footer"><span x-text="S.course"></span></footer>
</div>
</body>
</html>
